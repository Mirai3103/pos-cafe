name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cafe_pos
          POSTGRES_PASSWORD: cafe_pos_dev
          POSTGRES_DB: cafe_pos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cafe_pos -d cafe_pos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          # Single source of truth: the go directive in go.mod.
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Verify Formatting (gofmt)
        run: |
          diffs=$(gofmt -l .)
          if [ -n "$diffs" ]; then
            echo "Unformatted files found:"
            echo "$diffs"
            exit 1
          fi

      - name: Verify Generated Code Is In Sync (go mod tidy)
        run: |
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "go.mod/go.sum are stale. Run 'go mod tidy' and commit the result."
            exit 1
          fi

      - name: Go Vet
        run: go vet ./...

      - name: Run Unit Tests (-race)
        run: go test -v -race ./...

      # -p 1: integration packages share one database and TRUNCATE the same
      # tables, so they must not run in parallel with each other.
      - name: Run Integration Tests (-tags=integration)
        env:
          TEST_DATABASE_URL: postgres://cafe_pos:cafe_pos_dev@localhost:5432/cafe_pos_test?sslmode=disable
        run: go test -v -race -p 1 -tags=integration ./...

      - name: Verify Build
        run: go build -v ./cmd/api

  lint:
    name: Lint & Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      - name: Vulnerability Scan (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
