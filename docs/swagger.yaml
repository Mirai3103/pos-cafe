host: localhost:8080
info:
  contact: {}
  description: Backend API for Cafe Point of Sale System built with Vertical Slice
    Architecture and Idiomatic Go.
  title: POS Cafe API
  version: "1.0"
paths:
  /auth/activity:
    post:
      description: Cập nhật thời điểm hoạt động gần nhất để gia hạn tự động khóa do
        không hoạt động (inactivity timeout)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  additionalProperties:
                    type: boolean
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Ghi nhận hoạt động người dùng
      tags:
      - Auth
  /auth/bootstrap:
    post:
      consumes:
      - application/json
      description: Thiết lập tài khoản quản lý đầu tiên cho hệ thống POS. Chỉ thực
        hiện được khi chưa có quản lý nào.
      parameters:
      - description: Bootstrap manager credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.BootstrapManagerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/auth.StaffProfileResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Khởi tạo tài khoản Quản lý đầu tiên (Bootstrap)
      tags:
      - Auth
  /auth/identities:
    get:
      description: Trả về danh sách tên hiển thị và mã đăng nhập của nhân viên đang
        hoạt động (dùng cho màn hình chọn nhân viên POS)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/auth.IdentitySummaryResponse'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Danh sách định danh nhân viên đang hoạt động
      tags:
      - Auth
  /auth/lock:
    post:
      description: Chuyển trạng thái phiên làm việc hiện tại sang locked
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  additionalProperties:
                    type: string
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Khóa phiên làm việc
      tags:
      - Auth
  /auth/session:
    get:
      description: Kiểm tra và trả về trạng thái phiên làm việc hiện tại (authenticated,
        locked, signed_out) qua Bearer token hoặc cookie
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/auth.SessionStateResponse'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Lấy trạng thái phiên làm việc hiện tại
      tags:
      - Auth
  /auth/sign-in:
    post:
      consumes:
      - application/json
      description: Xác thực nhân viên bằng login_code và pin 4-8 số
      parameters:
      - description: Sign in credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.SignInRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/auth.SignInResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Đăng nhập bằng mã PIN
      tags:
      - Auth
  /auth/sign-out:
    post:
      description: Thu hồi phiên làm việc hiện tại và xóa cookie phiên
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  additionalProperties:
                    type: string
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Đăng xuất phiên làm việc
      tags:
      - Auth
  /auth/unlock:
    post:
      consumes:
      - application/json
      description: Mở khóa phiên làm việc đang bị khóa (locked) bằng mã PIN của nhân
        viên
      parameters:
      - description: Mã PIN mở khóa
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.UnlockRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/auth.SignInResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Mở khóa phiên làm việc
      tags:
      - Auth
  /auth/workspace:
    post:
      consumes:
      - application/json
      description: Khai báo khu vực làm việc (cashier, manager, preparation) cho phiên
        làm việc hiện tại
      parameters:
      - description: Khu vực làm việc
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.DeclareWorkspaceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  additionalProperties:
                    type: string
                  type: object
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
