  /sales/refunds:
    post:
      consumes:
      - application/json
      description: Returns real money through the original Payment method while consuming
        both corrected Charge Adjustment capacity and original Payment refundable
        capacity in equal sums. A live Refund resolves the active Service Session's
        pending Refund and returns the updated Service Session. A post-sale Refund
        consumes a POST_SALE correction of the Completed Sale, links to it, and returns
        its additive correction history without rewriting any closed row. A CASH Refund
        completes in the same transaction; a MANUAL_QR Refund stays PENDING until
        staff confirm the outbound transfer. Requires the initiator's sales.operate
        and one inline Manager Approval for sales.operate; self-approval is permitted
        and initiator and approver are recorded separately.
      parameters:
