  /sales/wastes/{waste_id}/comp:
    post:
      consumes:
      - application/json
      description: Waives the charge of one charged Wasted standard unit through one
        Manager-approved append-only correction. An active Service Session's Comp
        writes a LIVE_CHECK Charge Adjustment, updates the Check charge, settles the
        Check when the corrected balance reaches zero, and returns the updated Service
        Session. A closed Session's Comp writes a POST_SALE adjustment linked to its
        Completed Sale without rewriting the closed Check or sale, and returns the
        Completed Sale id, the outstanding post-sale correction amount, and the additive
        correction history. Requires the initiator's sales.operate and one inline
        Manager Approval for sales.operate; self-approval is permitted and initiator
        and approver are recorded separately. A Wasted Remake is uncharged and rejected.
      parameters:
      - description: Preparation Waste ID
        in: path
