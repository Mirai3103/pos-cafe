        maxLength: 8
        minLength: 4
        type: string
      request_id:
        type: string
      roles:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - display_name
    - login_code
    - manager_pin
    - pin
    - request_id
    - roles
    type: object
  auth.DeclareWorkspaceRequest:
