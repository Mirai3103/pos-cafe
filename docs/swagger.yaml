  /sales/payments/{payment_id}/void:
    post:
      consumes:
      - application/json
      description: Declares one whole Payment incorrect while its original Sales Shift
        is still open, appends an immutable reversal without editing or deleting the
        source Payment, recomputes the Check's corrected financials, and reopens the
        Check with all settlement evidence cleared when the remaining valid coverage
        no longer covers its charge. Rejected for a merged Check, an already-voided
        Payment, any Payment carrying a Refund allocation (pending or completed),
        a closed Service Session, and a Payment whose original Shift is closed or
        is no longer the currently open one. Requires the initiator's sales.operate
        and one inline Manager Approval for sales.operate; self-approval is permitted
        and initiator and approver are recorded separately. The Void is always for
        the entire applied amount, and a replacement Payment is recorded through the
        ordinary Cash or Manual QR command.
      parameters:
      - description: Payment ID
        in: path
