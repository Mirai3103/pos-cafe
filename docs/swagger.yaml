  /shifts:
    get:
      description: 'Returns Manager-visible closed Sales Shift summaries ordered by
        closed_at descending (ties by id) inside a half-open [closed_from, closed_to)
        window of at most 31 days. Pagination is keyset: a full page returns an opaque
        next_cursor to pass back verbatim; the cursor is exclusive and bound to the
        window it was minted over. Requires the audit.inspect capability; no fresh
        PIN is needed.'
      parameters:
      - description: Inclusive window start, RFC 3339
        in: query
        name: closed_from
        required: true
        type: string
      - description: Exclusive window end, RFC 3339
        in: query
        name: closed_to
        required: true
        type: string
      - description: Opaque next_cursor from the previous page
        in: query
        name: cursor
        type: string
      - description: Page size, default 50, capped at 100
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/shift.ClosedShiftListResponse'
              type: object
        "400":
          description: Missing or malformed window, a window over 31 days, a limit
            below one, or a malformed or mismatched cursor
          schema:
            $ref: '#/definitions/response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse'
        "403":
          description: Requires audit.inspect
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: List closed Sales Shifts
      tags:
      - shifts
    post:
      consumes:
      - application/json
      description: Opens a Sales Shift with a counted Opening Float. At most one Sales
        Shift may be open across the whole system.
      parameters:
      - description: Opening Float
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/shift.OpenShiftCommand'
      produces:
