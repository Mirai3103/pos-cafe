basePath: /api/v1
definitions:
  auth.BootstrapManagerRequest:
    properties:
      display_name:
        maxLength: 120
        minLength: 2
        type: string
      login_code:
        maxLength: 24
        minLength: 2
        type: string
      pin:
        maxLength: 8
        minLength: 4
        type: string
    required:
    - display_name
    - login_code
    - pin
    type: object
  auth.CreateStaffRequest:
    properties:
      display_name:
