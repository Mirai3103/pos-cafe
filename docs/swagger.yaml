      description: 'Returns one closed Sales Shift''s immutable detail: the summary,
        the complete frozen source scalars, the reconciliation starter, every Cash
        Count and Manual QR observation, the discrepancy rows, and the approving Manager
        when the close was discrepant. Only closed Shifts are exposed: an unknown
        id and a Shift that is still OPEN or CLOSING both return 404. Requires the
        audit.inspect capability; no fresh PIN is needed.'
