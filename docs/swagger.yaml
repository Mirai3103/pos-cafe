  /sales/refunds/{refund_id}/confirm:
    post:
      consumes:
      - application/json
      description: Completes an approved Manual QR Refund once staff confirm the outbound
        bank transfer. The Refund must exist, use MANUAL_QR, lack a completion, and
        belong to the current open Shift. Confirmation re-derives the obligation under
        the Check lock — the Check's pending Refund for a live Refund, the Completed
        Sale's outstanding correction for a post-sale Refund — and refuses an amount
        above it, so a completed Refund can never make a Check's balance positive.
        It appends exactly one completion with the confirmer identity and session,
        records an optional trimmed transaction_reference of at most 100 characters,
        writes MANUAL_QR_REFUND_COMPLETED, and never edits the Refund row or its allocations.
        Requires current sales.operate and no second Manager Approval. Exact replay
        returns the stored result; another request id after completion answers REFUND_ALREADY_COMPLETED.
      parameters:
      - description: Refund ID
        in: path
        name: refund_id
        required: true
        type: string
      - description: Confirmation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/sales.ConfirmManualQRRefundCommand'
