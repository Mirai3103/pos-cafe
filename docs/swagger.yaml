        type: string
      retirement_note:
        type: string
      retirement_reason:
        type: string
      surcharge_vnd:
        type: integer
    type: object
  catalog.ManagementSizeResponse:
    properties:
      available:
        type: boolean
      id:
        type: string
      menu_item_id:
        type: string
      name:
        type: string
      price_vnd:
        type: integer
      retired:
        type: boolean
      retired_at:
        type: string
      retirement_note:
        type: string
      retirement_reason:
        type: string
    type: object
  catalog.ModifierGroupDefaultsResponse:
    properties:
      group_id:
        type: string
      option_ids:
        items:
          type: string
        type: array
    type: object
  catalog.ModifierGroupResponse:
    properties:
      default_option_ids:
        items:
          type: string
        type: array
      id:
        type: string
      max_selections:
        type: integer
      min_selections:
        type: integer
      name:
        type: string
      options:
        items:
          $ref: '#/definitions/catalog.ModifierOptionResponse'
        type: array
    type: object
  catalog.ModifierOptionResponse:
    properties:
      available:
        type: boolean
      id:
        type: string
      modifier_group_id:
        type: string
