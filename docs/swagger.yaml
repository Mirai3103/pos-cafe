  /shifts/{shift_id}/close:
    post:
      consumes:
      - application/json
      description: Performs the Final Close of a CLOSING Sales Shift. The request
        carries the final evidence ids and, for a discrepant close, one reason per
        nonzero dimension. Amounts are always derived server-side from the frozen
        snapshot and the final evidence. A non-null empty discrepancies array closes
        exactly; any entry selects the discrepant close, which requires inline approval
        by an enabled Manager holding the MANAGER role, who authenticates with their
        own login code and PIN. Returns the immutable closed-Shift detail for both
        outcomes.
      parameters:
      - description: Sales Shift ID
        in: path
        name: shift_id
        required: true
        type: string
      - description: Final evidence and discrepancy reasons
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/shift.CloseShiftCommand'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/shift.ClosedShiftDetailResponse'
              type: object
        "400":
          description: Malformed body, omitted evidence id, a missing or null discrepancies
            array, or an invalid reason or note shape
          schema:
            $ref: '#/definitions/response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse'
        "403":
          description: Missing capability or failed Manager approval, collapsed to
            MANAGER_APPROVAL_UNAVAILABLE
          schema:
            $ref: '#/definitions/response.APIResponse'
        "404":
          description: Unknown Sales Shift or final attempt id
          schema:
            $ref: '#/definitions/response.APIResponse'
        "409":
          description: Lifecycle, blocker, stale evidence, source mismatch, recount/recheck,
            or discrepancy reason conflicts
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Close a reconciled Sales Shift
      tags:
      - shifts
