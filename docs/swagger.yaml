basePath: /api/v1
definitions:
  auth.BootstrapManagerRequest:
    properties:
      display_name:
        maxLength: 120
        minLength: 2
        type: string
      login_code:
        maxLength: 24
        minLength: 2
        type: string
      pin:
        maxLength: 8
        minLength: 4
        type: string
    required:
    - display_name
    - login_code
    - pin
    type: object
  auth.CreateStaffRequest:
    properties:
      display_name:
        maxLength: 120
        minLength: 1
        type: string
      enabled:
        type: boolean
      login_code:
        maxLength: 24
        minLength: 1
        type: string
      manager_pin:
        maxLength: 8
        minLength: 4
        type: string
      pin:
        maxLength: 8
        minLength: 4
        type: string
      request_id:
        type: string
      roles:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - display_name
    - login_code
    - manager_pin
    - pin
    - request_id
    - roles
    type: object
  auth.DeclareWorkspaceRequest:
    properties:
      workspace:
        enum:
        - cashier
        - manager
        - preparation
        type: string
    required:
    - workspace
    type: object
  auth.IdentitySummaryResponse:
    properties:
      display_name:
        type: string
      login_code:
        type: string
    type: object
  auth.ReplaceStaffRolesRequest:
    properties:
      manager_pin:
        maxLength: 8
        minLength: 4
        type: string
      request_id:
        type: string
      roles:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - manager_pin
    - request_id
    - roles
    type: object
  auth.ResetStaffPinRequest:
    properties:
      manager_pin:
        maxLength: 8
        minLength: 4
        type: string
      pin:
        maxLength: 8
        minLength: 4
        type: string
      request_id:
        type: string
    required:
    - manager_pin
    - pin
    - request_id
    type: object
  auth.SessionStateResponse:
    properties:
      capabilities:
        items:
          type: string
        type: array
      display_name:
        type: string
      login_code:
        type: string
      roles:
        items:
          type: string
        type: array
      staff_id:
        type: string
      state:
        description: '"authenticated", "locked", "signed_out"'
        type: string
      workspace:
        type: string
    type: object
  auth.SetStaffEnabledRequest:
    properties:
      enabled:
        type: boolean
      expected_enabled:
        type: boolean
      manager_pin:
        maxLength: 8
        minLength: 4
        type: string
      request_id:
        type: string
    required:
    - manager_pin
    - request_id
    type: object
  auth.SignInRequest:
    properties:
      login_code:
        maxLength: 24
        minLength: 1
        type: string
      pin:
        maxLength: 8
        minLength: 4
        type: string
    required:
    - login_code
    - pin
    type: object
  auth.SignInResponse:
    properties:
      staff:
        $ref: '#/definitions/auth.StaffProfileResponse'
      token:
        type: string
    type: object
  auth.StaffDetailResponse:
    properties:
      created_at:
        type: string
      display_name:
        type: string
      enabled:
        type: boolean
      id:
        type: string
      login_code:
        type: string
      roles:
        items:
          type: string
        type: array
    type: object
  auth.StaffProfileResponse:
    properties:
      capabilities:
        items:
          type: string
        type: array
      display_name:
        type: string
      enabled:
        type: boolean
      id:
        type: string
      login_code:
        type: string
      roles:
        items:
          type: string
        type: array
    type: object
  auth.UnlockRequest:
    properties:
      pin:
        maxLength: 8
        minLength: 4
        type: string
    required:
    - pin
    type: object
  catalog.AuditEventResponse:
    properties:
      actor_id:
        type: string
      details:
        type: object
      event_type:
        type: string
      id:
        type: string
      occurred_at:
        type: string
      session_id:
        type: string
    type: object
  catalog.AvailabilityCategoryResponse:
    properties:
      id:
        type: string
      items:
        items:
          $ref: '#/definitions/catalog.AvailabilityItemResponse'
        type: array
      name:
        type: string
    type: object
  catalog.AvailabilityItemResponse:
    properties:
      available:
        type: boolean
      category_id:
        type: string
      id:
        type: string
      modifier_groups:
        items:
          $ref: '#/definitions/catalog.AvailabilityModifierGroupResponse'
        type: array
      name:
        type: string
      sizes:
        items:
          $ref: '#/definitions/catalog.AvailabilitySizeResponse'
        type: array
    type: object
  catalog.AvailabilityMenuResponse:
    properties:
      categories:
        items:
          $ref: '#/definitions/catalog.AvailabilityCategoryResponse'
        type: array
    type: object
  catalog.AvailabilityModifierGroupResponse:
    properties:
      id:
        type: string
      max_selections:
        type: integer
      min_selections:
        type: integer
      name:
        type: string
      options:
        items:
          $ref: '#/definitions/catalog.AvailabilityModifierOptionResponse'
        type: array
    type: object
  catalog.AvailabilityModifierOptionResponse:
    properties:
      available:
        type: boolean
      id:
        type: string
      name:
        type: string
    type: object
  catalog.AvailabilitySizeResponse:
    properties:
      available:
        type: boolean
      id:
        type: string
      name:
        type: string
    type: object
  catalog.CategoryModifierGroupResponse:
    properties:
      category_id:
        type: string
      modifier_group_id:
        type: string
    type: object
  catalog.CategoryResponse:
    properties:
      id:
        type: string
      name:
        type: string
      retired:
        type: boolean
      retired_at:
        type: string
      retirement_note:
        type: string
      retirement_reason:
        type: string
    type: object
  catalog.CreateCategoryCommand:
    properties:
      name:
        type: string
      request_id:
        type: string
    type: object
  catalog.CreateItemCommand:
    properties:
      category_id:
        type: string
      manager_pin:
        type: string
      name:
        type: string
      price_vnd:
        type: integer
      request_id:
        type: string
      sizes:
        items:
          $ref: '#/definitions/catalog.CreateSizeInput'
        type: array
    type: object
  catalog.CreateModifierGroupCommand:
    properties:
      default_option_names:
        items:
          type: string
        type: array
      manager_pin:
        type: string
      max_selections:
        type: integer
      min_selections:
        type: integer
      name:
        type: string
      options:
        items:
          $ref: '#/definitions/catalog.CreateModifierOptionInput'
        type: array
      request_id:
        type: string
    type: object
  catalog.CreateModifierOptionInput:
    properties:
      name:
        type: string
      surcharge_vnd:
        type: integer
    type: object
  catalog.CreateSizeInput:
    properties:
      name:
        type: string
      price_vnd:
        type: integer
    type: object
  catalog.ItemModifierGroupExclusionResponse:
    properties:
      item_id:
        type: string
      modifier_group_id:
        type: string
    type: object
  catalog.ItemModifierGroupResponse:
    properties:
      item_id:
        type: string
      modifier_group_id:
        type: string
    type: object
  catalog.ItemResponse:
    properties:
      available:
        type: boolean
      category_id:
        type: string
      id:
        type: string
      name:
        type: string
      price_vnd:
        type: integer
      sizes:
        items:
          $ref: '#/definitions/catalog.SizeResponse'
        type: array
    type: object
  catalog.ManagementCategoryResponse:
    properties:
      id:
        type: string
      items:
        items:
          $ref: '#/definitions/catalog.ManagementItemResponse'
        type: array
      modifier_group_ids:
        items:
          type: string
        type: array
      name:
        type: string
      retired:
        type: boolean
      retired_at:
        type: string
      retirement_note:
        type: string
      retirement_reason:
        type: string
    type: object
  catalog.ManagementItemResponse:
    properties:
      available:
        type: boolean
      category_id:
        type: string
      direct_modifier_group_ids:
        items:
          type: string
        type: array
      excluded_modifier_group_ids:
        items:
          type: string
        type: array
      id:
        type: string
      modifier_groups:
        items:
          $ref: '#/definitions/catalog.ManagementModifierGroupResponse'
        type: array
      name:
        type: string
      price_vnd:
        type: integer
      retired:
        type: boolean
      retired_at:
        type: string
      retirement_note:
        type: string
      retirement_reason:
        type: string
      sizes:
        items:
          $ref: '#/definitions/catalog.ManagementSizeResponse'
        type: array
    type: object
  catalog.ManagementMenuResponse:
    properties:
      categories:
        items:
          $ref: '#/definitions/catalog.ManagementCategoryResponse'
        type: array
    type: object
  catalog.ManagementModifierGroupResponse:
    properties:
      default_option_ids:
        items:
          type: string
        type: array
      id:
        type: string
      max_selections:
        type: integer
      min_selections:
        type: integer
      name:
        type: string
      options:
        items:
          $ref: '#/definitions/catalog.ManagementModifierOptionResponse'
        type: array
      retired:
        type: boolean
      retired_at:
        type: string
      retirement_note:
        type: string
      retirement_reason:
        type: string
    type: object
  catalog.ManagementModifierOptionResponse:
    properties:
      available:
        type: boolean
      id:
        type: string
      modifier_group_id:
        type: string
      name:
