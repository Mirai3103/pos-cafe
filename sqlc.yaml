version: "2"
sql:
  - schema: "internal/platform/database/migrations"
    queries: "sql/queries"
    engine: "postgresql"
    gen:
      go:
        package: "sqlc"
        out: "internal/platform/database/sqlc"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_empty_slices: true
        emit_interface: true
